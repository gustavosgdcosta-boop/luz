<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Luz</title>
<style>
/* ============================================================
   Tokens — cores do sistema iOS, laranja como cor da app
   ============================================================ */
:root{
  --bg:#f2f2f7; --ink:#000; --ink-2:rgba(60,60,67,.6); --ink-3:rgba(60,60,67,.3);
  --fill:rgba(120,120,128,.16); --fill-2:rgba(120,120,128,.12); --sep:rgba(60,60,67,.18);
  --solid:#fff; --seg-sel:#fff; --menu-bg:rgba(250,250,252,.9);
  --tint:255,149,0;                 /* laranja do sistema (claro) */
  --green:52,199,89;
  /* vidro: iOS 27 — menos transparente, contorno mais definido */
  --g-bg:rgba(255,255,255,.62); --g-bg-strong:rgba(255,255,255,.78);
  --g-rim-a:rgba(255,255,255,.95); --g-rim-b:rgba(255,255,255,.25); --g-line:rgba(0,0,0,.07);
  --g-shadow:0 8px 28px rgba(0,0,0,.10), 0 1px 2px rgba(0,0,0,.06);
  --g-spec:rgba(255,255,255,.55);
  --light:255,140,60; --glow:.85;
  --pad:20px; --gap:14px; --r:32px;
  --font:-apple-system, "SF Pro Text", system-ui, sans-serif;
  --display:-apple-system, "SF Pro Display", system-ui, sans-serif;
  --rounded:ui-rounded, "SF Pro Rounded", -apple-system, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000; --ink:#fff; --ink-2:rgba(235,235,245,.6); --ink-3:rgba(235,235,245,.3);
    --fill:rgba(120,120,128,.32); --fill-2:rgba(120,120,128,.24); --sep:rgba(84,84,88,.6);
    --solid:#1c1c1e; --seg-sel:#636366; --menu-bg:rgba(38,38,42,.9);
    --tint:255,159,10;
    --green:48,209,88;
    --g-bg:rgba(44,44,48,.55); --g-bg-strong:rgba(58,58,62,.72);
    --g-rim-a:rgba(255,255,255,.42); --g-rim-b:rgba(255,255,255,.06); --g-line:rgba(0,0,0,.5);
    --g-shadow:0 10px 34px rgba(0,0,0,.45), 0 1px 2px rgba(0,0,0,.35);
    --g-spec:rgba(255,255,255,.16);
  }
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none}
html,body{height:100%; overflow:hidden; overscroll-behavior:none}
html{background:var(--bg)}
body{margin:0; position:fixed; inset:0; background:var(--bg); color:var(--ink); font:17px/1.29 var(--font); letter-spacing:-.022em;
  -webkit-font-smoothing:antialiased; display:flex; flex-direction:column;
  padding:env(safe-area-inset-top) max(var(--pad), env(safe-area-inset-right)) calc(96px + env(safe-area-inset-bottom)) max(var(--pad), env(safe-area-inset-left))}
button{font:inherit; letter-spacing:inherit; color:inherit; border:0; background:none; padding:0; cursor:pointer; touch-action:manipulation}

/* ============================================================
   Brilho ambiente — a cor escolhida acende o ecrã
   ============================================================ */
#ambient{position:fixed; inset:-30%; z-index:0; pointer-events:none; opacity:var(--glow); transition:opacity .6s ease;
  background:
    radial-gradient(42% 36% at 30% 22%, rgba(var(--light),.95), transparent 70%),
    radial-gradient(38% 34% at 78% 40%, rgba(var(--light),.55), transparent 72%),
    radial-gradient(60% 34% at 50% 96%, rgba(var(--light),.38), transparent 72%);
  filter:blur(48px) saturate(1.1)}
@media (prefers-color-scheme: light){ #ambient{mix-blend-mode:multiply; opacity:calc(var(--glow) * .9)} }

/* ============================================================
   Liquid Glass (aproximação web): corpo translúcido, aro de luz,
   reflexo especular em cima. Só em controlos e navegação.
   ============================================================ */
.glass{position:relative; isolation:isolate; background:var(--g-bg);
  -webkit-backdrop-filter:blur(26px) saturate(190%); backdrop-filter:blur(26px) saturate(190%);
  box-shadow:var(--g-shadow), 0 0 0 .5px var(--g-line)}
.glass::before{content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none; z-index:-1;
  background:linear-gradient(180deg, var(--g-spec), transparent 46%)}
.glass::after{content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none; padding:1px;
  background:linear-gradient(155deg, var(--g-rim-a), var(--g-rim-b) 32%, transparent 55%, var(--g-rim-b) 80%, var(--g-rim-a));
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite:xor;
          mask:linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0)}
.glass.tinted{background:rgba(var(--tint),.92); color:#fff}
.glass.tinted::before{background:linear-gradient(180deg, rgba(255,255,255,.42), transparent 55%)}

/* ============================================================
   Barra superior: título grande + botões de vidro
   ============================================================ */
header{position:relative; z-index:6; flex:none; display:flex; align-items:center; justify-content:space-between; gap:12px;
  height:64px; margin:8px 0 10px; max-width:1180px; width:100%; margin-inline:auto}
h1{margin:0; font:700 34px/1.1 var(--display); letter-spacing:.011em; white-space:nowrap}
.actions{display:flex; gap:10px}
.circle{width:44px; height:44px; border-radius:50%; display:grid; place-items:center; transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.circle:active{transform:scale(.9)}
.circle svg{width:21px; height:21px}
.circle .badge{position:absolute; top:7px; right:7px; width:9px; height:9px; border-radius:50%; background:rgb(var(--green)); box-shadow:0 0 0 2px var(--bg)}

/* Menu de vidro, ancorado ao botão que o abre */
.menu{position:fixed; z-index:20; width:270px; border-radius:26px; padding:8px; transform-origin:100% 0; opacity:0; pointer-events:none;
  background:var(--menu-bg)}
.menu.open{pointer-events:auto}
.menu .mi{display:flex; align-items:center; gap:12px; width:100%; min-height:48px; padding:0 14px; border-radius:18px; text-align:left; font-size:17px}
.menu .mi:active{background:var(--fill)}
.menu .mi svg{width:20px; height:20px; flex:none; color:var(--ink-2)}
.menu .mi small{display:block; font-size:13px; color:var(--ink-2); letter-spacing:-.005em}
.menu .mi.danger{color:#ff453a} .menu .mi.danger svg{color:#ff453a}
.menu hr{border:0; height:.5px; background:var(--sep); margin:6px 14px}
.scrim{position:fixed; inset:0; z-index:19; display:none}
.scrim.on{display:block}

/* ============================================================
   Separadores: barra flutuante em baixo (iPhone), no topo (iPad)
   ============================================================ */
nav.tabs{position:fixed; z-index:7; left:max(var(--pad), env(safe-area-inset-left)); right:max(var(--pad), env(safe-area-inset-right));
  bottom:calc(12px + env(safe-area-inset-bottom)); height:64px; border-radius:32px; padding:4px; display:grid; grid-auto-flow:column; grid-auto-columns:1fr}
nav.tabs button{position:relative; z-index:1; border-radius:28px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  font:600 10px/1 var(--font); letter-spacing:.01em; color:var(--ink); transition:color .2s}
nav.tabs button svg{width:26px; height:26px}
nav.tabs button[aria-selected="true"]{color:rgb(var(--tint))}
nav.tabs .lens{position:absolute; z-index:0; top:4px; bottom:4px; left:0; border-radius:28px; background:var(--fill-2);
  box-shadow:inset 0 .5px 0 rgba(255,255,255,.35); will-change:transform,width}

/* ============================================================
   Conteúdo — ocupa exatamente o espaço que sobra (sem scroll)
   ============================================================ */
main{position:relative; z-index:1; flex:1; min-height:0; width:100%; max-width:1180px; margin:0 auto}
.view{height:100%; min-height:0; display:grid; gap:var(--gap)}
.view[hidden]{display:none}
.module{border-radius:var(--r); padding:var(--pad); min-width:0; min-height:0; display:flex; flex-direction:column}
.mh{flex:none; display:flex; align-items:baseline; justify-content:space-between; margin:0 0 14px}
.mh h2{margin:0; font:600 20px/1.2 var(--display); letter-spacing:-.01em}
.mh .aside{font-size:15px; color:var(--ink-2)}

/* ---------- Luz ---------- */
#v-luz{grid-template-columns:minmax(0,1fr); grid-template-rows:minmax(0,1.12fr) minmax(0,1fr); grid-template-areas:"wheel" "bright"}
#v-luz .colors{display:none}
.wheel-zone{grid-area:wheel; container-type:size; display:grid; place-items:center; min-height:0}
.wheel{position:relative; width:calc(min(100cqw,100cqh) - 8px); aspect-ratio:1; border-radius:50%; touch-action:none;
  background:radial-gradient(circle closest-side, #fff 0%, rgba(255,255,255,.85) 12%, rgba(255,255,255,0) 100%),
             conic-gradient(from 90deg, #ff3b30, #ff9500, #ffcc00, #34c759, #00c7be, #32ade6, #007aff, #5856d6, #af52de, #ff2d55, #ff3b30);
  box-shadow:0 0 0 .5px rgba(255,255,255,.18), 0 18px 60px rgba(var(--light),.35)}
.wheel::after{content:""; position:absolute; inset:0; border-radius:50%; pointer-events:none;
  background:radial-gradient(circle at 50% 30%, rgba(255,255,255,.18), transparent 55%)}
.knob{position:absolute; left:0; top:0; z-index:2; width:46px; height:46px; margin:-23px 0 0 -23px; border-radius:50%; pointer-events:none;
  background:rgb(var(--light)); box-shadow:0 0 0 4px #fff, 0 6px 18px rgba(0,0,0,.32); will-change:transform}

.bright{grid-area:bright; display:grid; grid-template-columns:minmax(104px, 36%) 1fr; grid-template-rows:minmax(0,1fr); gap:var(--pad); padding:16px}
.capsule{position:relative; border-radius:30px; overflow:hidden; touch-action:none; background:var(--fill); transform-origin:50% 100%; will-change:transform;
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.08)}
.capsule .fill{position:absolute; inset:0; background:rgb(var(--tint)); transform-origin:50% 100%; will-change:transform}
.capsule .fill::before{content:""; position:absolute; inset:0; background:linear-gradient(180deg, rgba(255,255,255,.28), transparent 30%)}
.capsule .sun{position:absolute; left:50%; bottom:22px; width:30px; height:30px; margin-left:-15px; color:#fff; filter:drop-shadow(0 1px 2px rgba(0,0,0,.35)); pointer-events:none; will-change:transform}
.bside{display:flex; flex-direction:column; justify-content:space-between; min-width:0; padding:4px 4px 2px 0}
.bside .label{font:600 20px/1.2 var(--display); letter-spacing:-.01em}
.bside .state{font-size:15px; color:var(--ink-2); margin-top:2px}
.readout{font:600 clamp(44px, 9vmin, 64px)/1 var(--rounded); letter-spacing:-.02em; font-variant-numeric:tabular-nums}
.readout span{font-size:.45em; font-weight:600; color:var(--ink-2); margin-left:2px}
.power{align-self:flex-start; width:68px; height:68px; border-radius:50%; display:grid; place-items:center; transition:transform .25s cubic-bezier(.3,1.4,.5,1), background-color .3s, color .3s}
.power:active{transform:scale(.9)}
.power svg{width:28px; height:28px}
.power[aria-pressed="true"]{background:rgba(var(--tint),.95); color:#fff; box-shadow:0 10px 30px rgba(var(--tint),.45), 0 0 0 .5px rgba(0,0,0,.1)}
.power[aria-pressed="true"]::before{background:linear-gradient(180deg, rgba(255,255,255,.45), transparent 55%)}

/* ---------- Cores (favoritas + brancos) ---------- */
.colors{grid-area:colors; display:flex; flex-direction:column; gap:var(--gap); min-height:0}
.colors .favs-m{flex:1.35}
.colors .whites-m{flex:1}
.favs{flex:1; min-height:0; display:grid; grid-template-columns:repeat(4, 1fr); align-content:space-evenly; justify-items:center; row-gap:12px}
.fav{position:relative; width:min(62px, 100%); aspect-ratio:1; border-radius:50%; transition:transform .25s cubic-bezier(.3,1.4,.5,1);
  box-shadow:inset 0 0 0 .5px rgba(0,0,0,.15), inset 0 6px 10px rgba(255,255,255,.18)}
.fav:active{transform:scale(.88)}
.fav[aria-current="true"]{box-shadow:0 0 0 3px var(--solid), 0 0 0 5.5px var(--ink), inset 0 6px 10px rgba(255,255,255,.18)}
.fav.add{background:var(--fill); color:var(--ink-2); display:grid; place-items:center; box-shadow:none}
.fav.add svg{width:24px; height:24px}
.whites{flex:1; min-height:0; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px}
.white{position:relative; border-radius:calc(var(--r) - var(--pad) + 4px); padding:14px; display:flex; flex-direction:column; justify-content:space-between; align-items:flex-start;
  color:#1c1c1e; text-align:left; transition:transform .25s cubic-bezier(.3,1.4,.5,1); box-shadow:inset 0 0 0 .5px rgba(0,0,0,.08), inset 0 10px 20px rgba(255,255,255,.35)}
.white:active{transform:scale(.95)}
.white b{display:block; font:600 17px/1.2 var(--font)}
.white small{display:block; margin-top:2px; font-size:13px; opacity:.6; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100%}
.white > span:last-child{min-width:0; max-width:100%}
.white .chk{width:24px; height:24px; border-radius:50%; background:rgba(0,0,0,.08); display:grid; place-items:center; opacity:0; transform:scale(.6); transition:opacity .2s, transform .3s cubic-bezier(.3,1.5,.5,1)}
.white .chk svg{width:14px; height:14px}
.white[aria-pressed="true"] .chk{opacity:1; transform:none; background:#1c1c1e; color:#fff}

/* ---------- Efeitos ---------- */
#v-fx{grid-template-rows:minmax(0,1fr) auto}
.fxgrid{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); grid-auto-rows:minmax(0,1fr); gap:var(--gap); min-height:0}
.fxc{position:relative; border-radius:var(--r); padding:18px; text-align:left; display:flex; flex-direction:column; justify-content:space-between; min-height:0;
  transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.fxc:active{transform:scale(.96)}
.fxc .dots{display:flex; gap:6px}
.fxc .dots i{width:14px; height:14px; border-radius:50%; background:var(--c); box-shadow:0 0 12px var(--c)}
.fxc b{display:block; font:600 17px/1.2 var(--font)}
.fxc small{display:block; font-size:13px; color:var(--ink-2); margin-top:2px}
.fxc .chk{position:absolute; top:16px; right:16px; width:26px; height:26px; border-radius:50%; background:rgb(var(--tint)); color:#fff; display:grid; place-items:center;
  opacity:0; transform:scale(.5); transition:opacity .2s, transform .35s cubic-bezier(.3,1.6,.5,1)}
.fxc .chk svg{width:15px; height:15px}
.fxc[aria-pressed="true"] .chk{opacity:1; transform:none}
.fxc[aria-pressed="true"] .dots i{animation:pulse 1.6s ease-in-out infinite; animation-delay:calc(var(--i) * .16s)}
@keyframes pulse{0%,100%{transform:scale(1); opacity:1} 50%{transform:scale(.55); opacity:.45}}
.speed-m{padding:16px var(--pad) 18px}

/* Slider iOS 26/27: botão em cápsula que vira lente ao arrastar */
.slider{position:relative; height:36px; touch-action:none}
.slider .track{position:absolute; left:0; right:0; top:50%; height:6px; margin-top:-3px; border-radius:3px; background:var(--fill)}
.slider .track i{position:absolute; inset:0 auto 0 0; border-radius:3px; background:rgb(var(--tint))}
.slider .thumb{position:absolute; top:50%; left:0; width:38px; height:24px; margin:-12px 0 0 -19px; border-radius:12px; background:#fff;
  box-shadow:0 3px 10px rgba(0,0,0,.2), 0 0 0 .5px rgba(0,0,0,.06); transition:transform .3s cubic-bezier(.3,1.5,.5,1), background-color .2s}
.slider.active .thumb{transform:scale(1.45, 1.6); background:rgba(255,255,255,.35); -webkit-backdrop-filter:blur(2px) saturate(180%); backdrop-filter:blur(2px) saturate(180%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.8), inset 0 1px 3px rgba(255,255,255,.7), 0 6px 18px rgba(0,0,0,.18)}

/* ---------- Horários ---------- */
#v-timer{grid-template-rows:minmax(0,1fr) auto}
.sleep{justify-content:space-between}
.big{flex:1; min-height:0; display:flex; align-items:center; justify-content:center; gap:8px; font:300 clamp(64px, 16vmin, 120px)/1 var(--rounded); letter-spacing:-.03em; font-variant-numeric:tabular-nums}
.big span{font:600 20px/1 var(--font); color:var(--ink-2); letter-spacing:0; align-self:center; margin-top:.9em}
.seg{position:relative; display:grid; grid-auto-flow:column; grid-auto-columns:1fr; height:44px; padding:3px; border-radius:22px; background:var(--fill-2)}
.seg button{position:relative; z-index:1; border-radius:19px; font:600 15px var(--font); color:var(--ink)}
.seg .slens{position:absolute; z-index:0; top:3px; bottom:3px; left:0; border-radius:19px; background:var(--seg-sel);
  box-shadow:0 3px 10px rgba(0,0,0,.14), 0 0 0 .5px rgba(0,0,0,.05); will-change:transform}
.pill-btn{height:52px; border-radius:26px; margin-top:12px; font:600 17px var(--font); transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.pill-btn:active{transform:scale(.96)}
.list{padding:4px var(--pad)}
.row{display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:52px; position:relative}
.row + .row::before{content:""; position:absolute; left:0; right:0; top:0; height:.5px; background:var(--sep)}
.row .val{color:var(--ink-2); font-variant-numeric:tabular-nums}
/* Interruptor iOS 26/27 */
.switch{position:relative; flex:none; width:64px; height:28px; border-radius:14px; background:var(--fill); transition:background-color .25s}
.switch::after{content:""; position:absolute; top:2px; left:2px; width:38px; height:24px; border-radius:12px; background:#fff;
  box-shadow:0 3px 8px rgba(0,0,0,.16), 0 0 0 .5px rgba(0,0,0,.04); transition:transform .35s cubic-bezier(.3,1.35,.5,1), width .2s, background-color .2s}
.switch[aria-checked="true"]{background:rgb(var(--green))}
.switch[aria-checked="true"]::after{transform:translateX(22px)}
.switch:active::after{width:44px; background:rgba(255,255,255,.55); box-shadow:inset 0 0 0 1px rgba(255,255,255,.9), 0 6px 14px rgba(0,0,0,.18)}
.switch[aria-checked="true"]:active::after{transform:translateX(16px)}

/* ============================================================
   Disposições
   ============================================================ */
/* iPhone: separador "Cores" mostra favoritas + brancos */
#v-luz.show-colors{grid-template-rows:minmax(0,1fr); grid-template-areas:"colors"}
#v-luz.show-colors .wheel-zone, #v-luz.show-colors .bright{display:none}
#v-luz.show-colors .colors{display:flex}

/* iPhone deitado */
@media (orientation:landscape) and (max-height:599px){
  #v-luz{grid-template-columns:minmax(0,1fr) minmax(0,1fr); grid-template-rows:minmax(0,1fr); grid-template-areas:"wheel bright"}
  #v-luz.show-colors .colors{flex-direction:row}
  .fxgrid{grid-template-columns:repeat(3, minmax(0,1fr))}
  #v-timer{grid-template-columns:1fr 1fr; grid-template-rows:minmax(0,1fr)}
}

/* iPad e ecrãs grandes */
@media (min-width:700px) and (min-height:600px){
  :root{--pad:24px; --gap:18px; --r:36px}
  body{padding-bottom:max(var(--pad), env(safe-area-inset-bottom))}
  header{height:72px; margin:10px auto 14px}
  nav.tabs{left:50%; right:auto; bottom:auto; top:calc(env(safe-area-inset-top) + 20px); transform:translateX(-50%); height:52px; border-radius:26px; grid-auto-columns:118px}
  nav.tabs button{flex-direction:row; gap:7px; font:600 15px/1 var(--font); letter-spacing:-.01em; border-radius:22px}
  nav.tabs button svg{width:20px; height:20px}
  nav.tabs .lens{border-radius:22px}
  [data-view="v-cores"]{display:none !important}
  #v-luz, #v-luz.show-colors{grid-template-columns:minmax(0,1fr) minmax(0,1fr); grid-template-rows:minmax(0,1.1fr) minmax(0,1fr); grid-template-areas:"wheel wheel" "bright colors"}
  #v-luz .wheel-zone, #v-luz .bright{display:grid !important}
  #v-luz .colors{display:flex !important}
  .bright{grid-template-columns:minmax(110px,42%) 1fr; padding:18px}
  .fxgrid{grid-template-columns:repeat(3, minmax(0,1fr))}
  #v-timer{grid-template-columns:1.1fr 1fr; grid-template-rows:minmax(0,1fr)}
  #v-timer .list{align-self:start}
}
@media (min-width:700px) and (min-height:600px) and (orientation:landscape){
  #v-luz, #v-luz.show-colors{grid-template-columns:minmax(0,1.08fr) minmax(0,.62fr) minmax(0,.9fr); grid-template-rows:minmax(0,1fr); grid-template-areas:"wheel bright colors"}
  .bright{grid-template-columns:1fr; grid-template-rows:auto minmax(0,1fr) auto; padding:var(--pad)}
  .bright .bside{display:contents}
  .bright .bhead{grid-row:1}
  .bright .readout{display:none}
  .bright .capsule{grid-row:2}
  .bright .power{grid-row:3; justify-self:center; align-self:center}
}
/* Ecrãs baixos (iPhone pequeno, Bluefy com barras) */
@media (max-height:620px){
  header{height:52px; margin:4px auto 6px} h1{font-size:30px}
  :root{--pad:16px; --gap:12px}
  .mh{margin-bottom:10px}
}

@media (prefers-reduced-motion: reduce){
  #ambient{transition:none} .fxc .dots i{animation:none !important}
  .switch::after, .slider .thumb, .white .chk, .fxc .chk{transition:none}
}
@media (prefers-reduced-transparency: reduce){
  .glass{background:var(--solid); -webkit-backdrop-filter:none; backdrop-filter:none}
  .glass::before{display:none}
}
@media (prefers-contrast: more){ .glass::after{background:var(--ink)} }
</style>
</head>
<body>
<div id="ambient" aria-hidden="true"></div>

<header>
  <h1 id="title">Luz</h1>
  <div class="actions">

<script>
/* ============================================================
   Mola ao estilo Apple (damping ratio + response), interrompível
   ============================================================ */
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
class Spring{
  constructor(v,{damping=1,response=.4}={}){ this.x=v; this.v=0; this.target=v; this.set(damping,response); this.cb=null; }
  set(d,r){ this.k=(2*Math.PI/r)**2; this.c=4*Math.PI*d/r; }
  to(t,{velocity,damping,response}={}){ if(damping!=null) this.set(damping,response??.4); if(velocity!=null) this.v=velocity; this.target=t;
    if(reduced){ this.x=t; this.v=0; this.cb&&this.cb(t); return; } Spring.run(this); }
  jump(t){ this.x=this.target=t; this.v=0; this.cb&&this.cb(t); }
  step(dt){ const a=-this.k*(this.x-this.target)-this.c*this.v; this.v+=a*dt; this.x+=this.v*dt;
    const done=Math.abs(this.v)<.001&&Math.abs(this.x-this.target)<.0005; if(done){ this.x=this.target; this.v=0; } this.cb&&this.cb(this.x); return done; }
  static run(s){ Spring.active.add(s); if(Spring.raf) return; let last=performance.now();
    const loop=now=>{ const dt=Math.min(.032,(now-last)/1000); last=now; const n=Math.ceil(dt/.004)||1;
      for(const sp of [...Spring.active]){ let done=false; for(let i=0;i<n;i++) done=sp.step(dt/n); if(done) Spring.active.delete(sp); }
      Spring.raf=Spring.active.size?requestAnimationFrame(loop):0; };
    Spring.raf=requestAnimationFrame(loop); }
}
Spring.active=new Set(); Spring.raf=0;
const rubber=(o,d,c=.55)=>(o*d*c)/(d+c*Math.abs(o));
function tracker(){ const p=[]; return { add(v){ const t=performance.now(); p.push([t,v]); while(p.length>2&&t-p[0][0]>100) p.shift(); },
  get(){ if(p.length<2) return 0; const [a,va]=p[0],[b,vb]=p[p.length-1]; return (vb-va)/Math.max(1,b-a)*1000; }, reset(){ p.length=0; } }; }
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';

/* ============================================================
   Estado da luz
   ============================================================ */
const css=document.documentElement.style;
const S={ on:true, h:28, s:.78, b:.8, white:null };
const hsv=(h,s)=>{ const f=n=>{ const k=(n+h/60)%6; return 1-s*Math.max(0,Math.min(k,4-k,1)); }; return [f(5),f(3),f(1)].map(x=>Math.round(x*255)); };
const hex=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
const toHS=(r,g,b)=>{ const mx=Math.max(r,g,b), mn=Math.min(r,g,b), s=mx?(mx-mn)/mx:0; let h=0;
  if(mx!==mn){ h= mx===r ? 60*(((g-b)/(mx-mn))%6) : mx===g ? 60*((b-r)/(mx-mn)+2) : 60*((r-g)/(mx-mn)+4); } return [(h+360)%360,s]; };
const whites=$$('.white'); whites.forEach(w=>w.style.background=w.dataset.show);

function paint(){
  const [r,g,b] = S.white!=null ? hex(whites[S.white].dataset.show) : hsv(S.h,S.s);
  css.setProperty('--light',`${r},${g},${b}`);
  css.setProperty('--glow', S.on ? (.45+.55*S.b).toFixed(3) : '0.12');
  $('#power').setAttribute('aria-pressed', S.on);
  $('#bstate').textContent = S.on ? 'Ligada' : 'Desligada';
  $$('.fav[data-c]').forEach(f=>f.setAttribute('aria-current', S.white==null && f.dataset.c===`${r},${g},${b}`));
  whites.forEach((w,i)=>w.setAttribute('aria-pressed', S.white===i));
  send();
}
let st=0; function send(){ clearTimeout(st); st=setTimeout(()=>{ /* app final: escreve cor (ou data-send do branco) e brilho na fita por Bluetooth */ },40); }

/* ============================================================
   Roda de cor — arrasto 1:1, molas X/Y independentes,
   o botão cresce como uma lupa enquanto o dedo está em cima
   ============================================================ */
const wheel=$('#wheel'), knob=$('#knob');
const kx=new Spring(0,{response:.35}), ky=new Spring(0,{response:.35}), ks=new Spring(1,{damping:.7,response:.3});
const drawK=()=>{ knob.style.transform=`translate3d(${kx.x}px,${ky.x}px,0) scale(${ks.x})`; }; kx.cb=ky.cb=ks.cb=drawK;
const geo=()=>{ const r=wheel.getBoundingClientRect(); return {R:r.width/2, l:r.left, t:r.top}; };
const posFor=(h,s)=>{ const g=geo(), a=h*Math.PI/180; return [g.R+Math.cos(a)*s*g.R, g.R+Math.sin(a)*s*g.R]; };
function placeK(anim,opt){ const [x,y]=posFor(S.h,S.s); if(anim){ kx.to(x,opt); ky.to(y,opt); } else { kx.jump(x); ky.jump(y); } }
function pick(px,py){ const g=geo(), dx=px-g.l-g.R, dy=py-g.t-g.R; S.h=(Math.atan2(dy,dx)*180/Math.PI+360)%360; S.s=Math.min(1,Math.hypot(dx,dy)/g.R); S.white=null; }
let wd=false;
wheel.addEventListener('pointerdown',e=>{ wheel.setPointerCapture(e.pointerId); wd=true; pick(e.clientX,e.clientY); S.on=true;
  placeK(true,{damping:1,response:.28}); ks.to(1.35,{damping:.65,response:.3}); paint(); });
wheel.addEventListener('pointermove',e=>{ if(!wd) return; pick(e.clientX,e.clientY); const [x,y]=posFor(S.h,S.s);
  kx.to(x,{damping:1,response:.1}); ky.to(y,{damping:1,response:.1}); paint(); });
const endW=()=>{ if(!wd) return; wd=false; ks.to(1,{damping:.6,response:.35}); };
wheel.addEventListener('pointerup',endW); wheel.addEventListener('pointercancel',endW);
new ResizeObserver(()=>placeK(false)).observe(wheel);

/* ============================================================
   Brilho — cápsula estilo Centro de Controlo: arrasto 1:1,
   elástico nas pontas, devolução com a velocidade do dedo
   ============================================================ */
const cap=$('#cap'), fill=$('#fill'), sun=$('#sun'), readout=$('#readout');
const shown=new Spring(S.b,{response:.3});
shown.cb=x=>{ const over=x>1?x-1:x<0?x:0, base=Math.max(0,Math.min(1,x)), v=S.on?base:0;
  fill.style.transform=`scaleY(${v})`;
  cap.style.transform= over ? `scale(${1+Math.abs(over)*.14},${1+Math.abs(over)*.3})` : '';
  cap.style.transformOrigin = over>0 ? '50% 100%' : '50% 0%';
  sun.style.transform=`scale(${.75+.4*v}) rotate(${v*90}deg)`;
  const p=Math.round(v*100); readout.firstChild.textContent=p; cap.setAttribute('aria-valuenow',p); };
let cd=null; const vt=tracker();
cap.addEventListener('pointerdown',e=>{ cap.setPointerCapture(e.pointerId); cd={y:e.clientY, b0:S.on?S.b:0, moved:false, h:cap.clientHeight}; vt.reset(); });
cap.addEventListener('pointermove',e=>{ if(!cd) return; const dy=cd.y-e.clientY;
  if(!cd.moved){ if(Math.abs(dy)<8) return; cd.moved=true; S.on=true; cd.y=e.clientY; cd.b0=S.on?S.b:0; return; }
  const raw=cd.b0+dy/cd.h, disp= raw>1 ? 1+rubber(raw-1,1) : raw<0 ? rubber(raw,1) : raw;
  S.b=Math.max(.01,Math.min(1,raw)); vt.add(disp); shown.jump(disp); paint(); });
const endC=()=>{ if(!cd) return;
  if(!cd.moved){ S.on=!S.on; paint(); shown.to(S.b,{velocity:0,damping:1,response:.3}); shown.cb(shown.x); }
  else shown.to(S.b,{velocity:vt.get(),damping:.8,response:.35});
  cd=null; };
cap.addEventListener('pointerup',endC); cap.addEventListener('pointercancel',endC);
cap.addEventListener('keydown',e=>{ const d={ArrowUp:.05,ArrowRight:.05,ArrowDown:-.05,ArrowLeft:-.05}[e.key]; if(d==null) return;
  e.preventDefault(); S.on=true; S.b=Math.max(.01,Math.min(1,S.b+d)); shown.to(S.b); paint(); });
$('#power').addEventListener('click',()=>{ S.on=!S.on; paint(); shown.cb(shown.x); });

/* ============================================================
   Favoritas e brancos
   ============================================================ */
const favs=[[0,1],[28,.78],[48,.95],[130,.8],[190,.85],[215,1],[330,.75]];
function renderFavs(){ const box=$('#favs'); box.innerHTML='';
  favs.slice(-7).forEach(([h,s])=>{ const [r,g,b]=hsv(h,s), el=document.createElement('button'); el.className='fav';
    el.style.background=`rgb(${r},${g},${b})`; el.dataset.c=`${r},${g},${b}`; el.setAttribute('aria-label','Cor favorita');
    el.onclick=()=>{ S.h=h; S.s=s; S.white=null; S.on=true; placeK(true,{damping:1,response:.45}); paint(); shown.cb(shown.x); };
    box.appendChild(el); });
  const add=document.createElement('button'); add.className='fav add'; add.setAttribute('aria-label','Guardar a cor atual');
  add.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
  add.onclick=()=>{ if(S.white==null){ favs.push([S.h,S.s]); renderFavs(); paint(); } };
  box.appendChild(add); $('#favcount').textContent=favs.length+' cores'; }
renderFavs();
whites.forEach((w,i)=>w.onclick=()=>{ const [h,s]=toHS(...hex(w.dataset.show)); S.h=h; S.s=s; S.white=i; S.on=true; placeK(true); paint(); shown.cb(shown.x); });

/* ============================================================
   Efeitos
   ============================================================ */
const FX=[
  ['Arco-íris','Todas as cores, suave',['#ff3b30','#ff9500','#ffcc00','#34c759','#007aff']],
  ['Respirar','Acende e apaga devagar',['#0a84ff','#0a84ff','#0a84ff']],
  ['Vela','Tremeluzir quente',['#ff9f0a','#ff6a00','#ffb340']],
  ['Pulsar','Vermelho e laranja',['#ff2d55','#ff9f0a']],
  ['Oceano','Verde e azul',['#30d158','#64d2ff','#0a84ff']],
  ['Estroboscópio','Branco rápido',['#ffffff','#ffffff','#ffffff','#ffffff']],
];
const fxBox=$('#fx');
FX.forEach(([n,d,cs])=>{ const b=document.createElement('button'); b.className='fxc glass'; b.setAttribute('aria-pressed','false');
  b.innerHTML=`<span class="dots">${cs.map((c,i)=>`<i style="--c:${c};--i:${i}"></i>`).join('')}</span><span><b>${n}</b><small>${d}</small></span><span class="chk">${CHECK}</span>`;
  b.onclick=()=>{ const on=b.getAttribute('aria-pressed')!=='true'; $$('.fxc').forEach(x=>x.setAttribute('aria-pressed', x===b && on)); };
  fxBox.appendChild(b); });

(function(){ const el=$('#spd'), th=el.querySelector('.thumb'), bar=el.querySelector('i'), out=$('#spdv');
  const sp=new Spring(.5,{response:.25}); sp.cb=x=>{ const w=el.clientWidth-38; th.style.left=(19+x*w)+'px'; bar.style.width=(19+x*w)+'px'; };
  let on=false; const set=e=>{ const r=el.getBoundingClientRect(); const v=Math.max(0,Math.min(1,(e.clientX-r.left-19)/(r.width-38)));
    sp.to(v,{damping:1,response:on?.08:.25}); out.textContent=Math.round(v*100)+'%'; el.setAttribute('aria-valuenow',Math.round(v*100)); };
  el.addEventListener('pointerdown',e=>{ el.setPointerCapture(e.pointerId); on=true; el.classList.add('active'); set(e); });
  el.addEventListener('pointermove',e=>{ if(on) set(e); });
  const end=()=>{ on=false; el.classList.remove('active'); }; el.addEventListener('pointerup',end); el.addEventListener('pointercancel',end);
  new ResizeObserver(()=>sp.cb(sp.x)).observe(el); })();

/* ============================================================
   Horários: controlo segmentado com lente, interruptores
   ============================================================ */
(function(){ const seg=$('#seg'), lens=$('#slens'), bs=[...seg.querySelectorAll('button')];
  const lx=new Spring(0,{damping:.85,response:.32}); let w=0; lx.cb=x=>{ lens.style.transform=`translateX(${x}px)`; lens.style.width=w+'px'; };
  const sel=(b,anim)=>{ bs.forEach(x=>x.setAttribute('aria-checked',x===b)); w=b.offsetWidth; anim?lx.to(b.offsetLeft):lx.jump(b.offsetLeft); $('#big').firstChild.textContent=b.textContent; };
  bs.forEach(b=>b.onclick=()=>sel(b,true));
  new ResizeObserver(()=>sel(bs.find(b=>b.getAttribute('aria-checked')==='true'),false)).observe(seg); })();
$$('.switch').forEach(s=>s.onclick=()=>s.setAttribute('aria-checked', s.getAttribute('aria-checked')!=='true'));

/* ============================================================
   Menu da ligação — abre a partir do botão (mola), fecha ao tocar fora
   ============================================================ */
(function(){ const btn=$('#conn'), menu=$('#menu'), scrim=$('#scrim');
  const sc=new Spring(.4,{damping:.8,response:.32}), op=new Spring(0,{response:.2});
  const draw=()=>{ menu.style.transform=`scale(${sc.x})`; menu.style.opacity=Math.max(0,Math.min(1,op.x)); }; sc.cb=op.cb=draw;
  let open=false;
  const set=o=>{ open=o; btn.setAttribute('aria-expanded',o); menu.classList.toggle('open',o); scrim.classList.toggle('on',o);
    if(o){ const r=btn.getBoundingClientRect(); menu.style.top=(r.bottom+10)+'px'; menu.style.right=(innerWidth-r.right)+'px'; }
    sc.to(o?1:.4,{damping:o?.78:1,response:o?.34:.22}); op.to(o?1:0,{response:o?.18:.16}); };
  btn.onclick=()=>set(!open); scrim.addEventListener('pointerdown',()=>set(false));
  menu.querySelectorAll('button').forEach(b=>b.onclick=()=>set(false)); draw(); })();

/* ============================================================
   Separadores — a lente desliza com mola e estica-se ao premir
   ============================================================ */
const tabs=$$('nav.tabs button'), lens=$('#lens'), luz=$('#v-luz');
const lx=new Spring(0,{damping:.8,response:.36}), lw=new Spring(0,{damping:1,response:.3}), lsy=new Spring(1,{damping:.6,response:.3});
const drawL=()=>{ lens.style.transform=`translateX(${lx.x}px) scaleY(${lsy.x})`; lens.style.width=lw.x+'px'; }; lx.cb=lw.cb=lsy.cb=drawL;
let cur=tabs[0];
function select(t,anim=true){
  cur=t; tabs.forEach(x=>x.setAttribute('aria-selected',x===t));
  const v=t.dataset.view, isLuz=v==='v-luz'||v==='v-cores';
  $$('section.view').forEach(s=>s.hidden = isLuz ? s.id!=='v-luz' : s.id!==v);
  luz.classList.toggle('show-colors', v==='v-cores');
  $('#title').textContent=t.dataset.title;
  const x=t.offsetLeft, w=t.offsetWidth;
  if(anim){ lx.to(x,{damping:.8,response:.36}); lw.to(w); lsy.to(1,{damping:.6,response:.35}); } else { lx.jump(x); lw.jump(w); }
  requestAnimationFrame(()=>placeK(false));
}
tabs.forEach(t=>{ t.addEventListener('pointerdown',()=>lsy.to(1.12,{damping:.6,response:.18})); t.addEventListener('click',()=>select(t)); });
const wide=matchMedia('(min-width:700px) and (min-height:600px)');
const relayout=()=>{ if(wide.matches && cur.dataset.view==='v-cores') select(tabs[0],false); else select(cur,false); };
wide.addEventListener('change',relayout); addEventListener('resize',relayout);

paint(); shown.jump(S.b); select(tabs[0],false);
</script>
</body>
</html>
